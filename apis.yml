description: 'AVS (listed by Battery Ventures as "AVS, Inc.") is a former Battery Ventures
  portfolio company. Battery''s public list of all companies marks the entry with an
  asterisk, which its own legend defines as "Denotes an exited investment," so AVS is
  a historical holding rather than an active one. Enrichment research on 2026-07-20 —
  Battery''s company list and WordPress API, targeted web search, and probes of
  battery.com/company/avs and battery.com/portfolio/avs (both HTTP 404) — surfaced no
  company website, no developer portal, no documentation, and no API, specification,
  SDK, or other machine-readable artifact that can be attributed to this specific AVS
  with confidence. The name is heavily overloaded across unrelated firms (medical
  device, life-science services, audio-visual, voice recognition), and none of those
  could be tied back to the Battery investment. This profile is therefore retained as
  an identity-only record with no API surface; it is not a scored API provider.'
